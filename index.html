function EligibilityView({ onNav }) {
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null); // "eligible" | "ineligible" | null

  const current = ELIGIBILITY_QUESTIONS[step];
  const total = ELIGIBILITY_QUESTIONS.length;

  const handleAnswer = (answer) => {
    const newAnswers = {...answers, [current.id]: answer};
    setAnswers(newAnswers);
    if (!answer) {
      setResult("ineligible");
    } else if (step + 1 >= total) {
      setResult("eligible");
    } else {
      setStep(step + 1);
    }
  };

  const restart = () => { setStep(0); setAnswers({}); setResult(null); };

  if (result === "eligible") {
    return (
      <div style={{maxWidth: 640, margin: "48px auto 0"}}>
        <div style={{background: "linear-gradient(135deg, #E8F9ED, #D4F5DE)", borderRadius: 24, padding: 40, textAlign: "center", border: "1px solid rgba(52,199,89,0.2)"}}>

}

function ChecklistView({ onNav }) {
  const [completed, setCompleted] = useState(() => {
    try { return JSON.parse(window.sessionStorage?.getItem?.("cl") || "[]"); } catch { return []; }
  });
  const [expanded, setExpanded] = useState(null);

  const toggle = (id) => {
    const next = completed.includes(id) ? completed.filter(x => x !== id) : [...completed, id];
    setCompleted(next);
    try { window.sessionStorage?.setItem?.("cl", JSON.stringify(next)); } catch {}
  };

  const progress = Math.round((completed.length / PROCESS_STEPS.length) * 100);

  return (
    <div style={{maxWidth: 720, margin: "48px auto 0"}}>
      <div style={{marginBottom: 32}}>
        <button onClick={() => onNav("home")} style={{display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#0071E3", fontWeight: 500, padding: 0, marginBottom: 16}}>
          <ArrowLeft size={16} /> Inicio
        </button>
        <h2 style={{fontSize: 28, fontWeight: 700, margin: "0 0 8px", letterSpacing: "-0.02em"}}>Proceso de Naturalización</h2>

          <div style={{flex: 1, height: 6, background: "#E5E5EA", borderRadius: 3}}>
            <div style={{height: 6, background: "linear-gradient(90deg, #0071E3, #34C759)", borderRadius: 3, width: `${progress}%`, transition: "width 0.5s ease"}} />
          </div>
          <span style={{fontSize: 14, fontWeight: 600, color: "#0071E3", minWidth: 40}}>{progress}%</span>
        </div>
      </div>

      {[
        { label: "Fase 1 — Preparación", color: "#0038a8", bg: "rgba(0,56,168,0.06)", steps: PROCESS_STEPS.filter(s => s.id <= 3) },
        { label: "Fase 2 — Solicitud y Examen", color: "#FF9500", bg: "rgba(255,149,0,0.06)", steps: PROCESS_STEPS.filter(s => s.id >= 4 && s.id <= 7) },
        { label: "Fase 3 — Resultado y Ceremonia", color: "#34C759", bg: "rgba(52,199,89,0.06)", steps: PROCESS_STEPS.filter(s => s.id >= 8) },
      ].map(phase => (
        <div key={phase.label} style={{marginBottom: 28}}>
          <div className="section-sticky" style={{background: "#F0F4FF", paddingBottom: 8}}>
            <div style={{background: phase.bg, border: `1px solid ${phase.color}22`, borderRadius: 10, padding: "8px 16px", display: "inline-flex", alignItems: "center", gap: 8}}>
              <span className="phase-label" style={{color: phase.color}}>{phase.label}</span>
              <span style={{fontSize: 12, color: phase.color, fontWeight: 600, background: `${phase.color}18`, borderRadius: 6, padding: "2px 8px"}}>
                {phase.steps.filter(s => completed.includes(s.id)).length}/{phase.steps.length}

            </div>
          </div>
          <div style={{display: "flex", flexDirection: "column", gap: 8, marginTop: 8}}>
            {phase.steps.map((step) => {
              const done = completed.includes(step.id);
              const isExpanded = expanded === step.id;
              const Icon = IconMap[step.icon] || CircleDot;
              return (

function StudyView({ onNav }) {
  const [filter, setFilter] = useState("all"); // all, starred, section
  const [sectionFilter, setSectionFilter] = useState("");
  const [searchTerm, setSearchTerm] = useState("");
  const [showAnswer, setShowAnswer] = useState({});
  const [currentCard, setCurrentCard] = useState(0);
  const [mode, setMode] = useState("browse"); // browse | flashcard

  const sections = useMemo(() => [...new Set(CIVICS_QUESTIONS.map(q => q.section))], []);
  
  const filtered = useMemo(() => {
    let qs = CIVICS_QUESTIONS;
    if (filter === "starred") qs = qs.filter(q => q.starred);
    if (sectionFilter) qs = qs.filter(q => q.section === sectionFilter);
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      qs = qs.filter(q => q.q_es.toLowerCase().includes(s) || q.q_en.toLowerCase().includes(s) || q.answers_es.some(a => a.toLowerCase().includes(s)) || q.answers_en.some(a => a.toLowerCase().includes(s)));
    }
    return qs;
  }, [filter, sectionFilter, searchTerm]);

  const toggleAnswer = (id) => setShowAnswer(prev => ({...prev, [id]: !prev[id]}));

  if (mode === "flashcard") {
    const q = filtered[currentCard] || filtered[0];
    if (!q) return <div style={{padding: 48, textAlign: "center"}}>No hay preguntas con estos filtros.</div>;
    const flipped = !!showAnswer[`fc_${q.id}`];
    const goNext = () => { setCurrentCard(currentCard + 1); setShowAnswer(p => { const n = {...p}; delete n[`fc_${q.id}`]; return n; }); };
    const goPrev = () => { setCurrentCard(currentCard - 1); setShowAnswer(p => { const n = {...p}; delete n[`fc_${q.id}`]; return n; }); };

          </button>
          <div style={{display: "flex", alignItems: "center", gap: 8}}>
            <span style={{fontSize: 13, color: "#6e6e73", fontWeight: 500}}>{currentCard + 1} / {filtered.length}</span>
            {flipped && <span style={{fontSize: 12, background: "rgba(52,199,89,0.1)", color: "#34C759", borderRadius: 6, padding: "2px 8px", fontWeight: 600}}>Respuesta</span>}

                <div style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 16}}>

                  {q.starred && <Star size={14} color="#FF9500" fill="#FF9500" />}

              <div style={{textAlign: "center", marginTop: 24}}>

    <div style={{maxWidth: 800, margin: "48px auto 0"}}>
      <div style={{marginBottom: 28}}>
        <button onClick={() => onNav("home")} style={{display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#0071E3", fontWeight: 500, padding: 0, marginBottom: 16}}>

        </button>
        <h2 style={{fontSize: 28, fontWeight: 700, margin: "0 0 8px", letterSpacing: "-0.02em"}}>Aprender Educación Cívica</h2>
        <p style={{fontSize: 15, color: "#6e6e73", margin: 0}}>128 preguntas del examen cívico 2025 — en inglés y español.</p>
      </div>

      {/* Controls */}
      <div style={{display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20}}>
        <button onClick={() => setMode("flashcard")} style={{display: "flex", alignItems: "center", gap: 6, padding: "8px 16px", borderRadius: 10, border: "none", background: "#0071E3", color: "#fff", fontSize: 14, fontWeight: 600, cursor: "pointer"}}>

        <button onClick={() => { setFilter(filter === "starred" ? "all" : "starred"); setSectionFilter(""); }} style={{display: "flex", alignItems: "center", gap: 6, padding: "8px 16px", borderRadius: 10, border: filter === "starred" ? "2px solid #FF9500" : "1px solid #D1D1D6", background: filter === "starred" ? "rgba(255,149,0,0.08)" : "#fff", fontSize: 14, fontWeight: 500, cursor: "pointer", color: "#1d1d1f"}}>
          <Star size={14} color="#FF9500" fill={filter === "starred" ? "#FF9500" : "none"} /> 65/20 ({CIVICS_QUESTIONS.filter(q => q.starred).length})
        </button>
        <select value={sectionFilter} onChange={e => { setSectionFilter(e.target.value); setFilter("all"); }} style={{padding: "8px 12px", borderRadius: 10, border: "1px solid #D1D1D6", fontSize: 14, color: "#1d1d1f", background: "#fff"}}>
          <option value="">Todas las secciones</option>
          {sections.map(s => <option key={s} value={s}>{s}</option>)}

      {/* Search */}
      <div style={{position: "relative", marginBottom: 20}}>

    </div>

function SimulationView({ onNav }) {
  const [phase, setPhase] = useState("setup"); // setup | exam | result
  const [questionCount, setQuestionCount] = useState(20);
  const [onlyStarred, setOnlyStarred] = useState(false);
  const [questions, setQuestions] = useState([]);
  const [current, setCurrent] = useState(0);
  const [userAnswers, setUserAnswers] = useState({});
  const [showHint, setShowHint] = useState(false);
  const [showResult, setShowResult] = useState(false);

  const startExam = () => {
    const pool = onlyStarred ? CIVICS_QUESTIONS.filter(q => q.starred) : CIVICS_QUESTIONS;
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    setQuestions(shuffled.slice(0, Math.min(questionCount, shuffled.length)));
    setCurrent(0);
    setUserAnswers({});
    setShowHint(false);
    setShowResult(false);
    setPhase("exam");
  };

  const markAnswer = (qId, status) => {
    setUserAnswers(prev => ({...prev, [qId]: status}));
    setShowHint(false);
    setShowResult(false);
  };

  const finish = () => {
    setPhase("result");
  };

  const nextQ = () => {
    setShowHint(false);
    setShowResult(false);
    if (current < questions.length - 1) setCurrent(current + 1);
    else finish();
  };

  if (phase === "setup") {
    return (
      <div style={{maxWidth: 560, margin: "48px auto 0"}}>
        <div style={{marginBottom: 32}}>
          <button onClick={() => onNav("home")} style={{display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#0071E3", fontWeight: 500, padding: 0, marginBottom: 16}}>
            <ArrowLeft size={16} /> Inicio
          </button>
          <h2 style={{fontSize: 28, fontWeight: 700, margin: "0 0 8px", letterSpacing: "-0.02em"}}>Simulación de Entrevista</h2>
          <p style={{fontSize: 15, color: "#6e6e73", margin: 0}}>Practique como en el examen real. El oficial de USCIS le hará preguntas oralmente.</p>
        </div>
        <div style={{background: "#fff", borderRadius: 20, padding: 32, border: "1px solid rgba(0,0,0,0.06)"}}>
          <div style={{marginBottom: 24}}>
            <label style={{fontSize: 14, fontWeight: 600, color: "#1d1d1f", display: "block", marginBottom: 8}}>Cantidad de preguntas</label>
            <div style={{display: "flex", gap: 8}}>
              {[10, 20, 30, 50].map(n => (
                <button key={n} onClick={() => setQuestionCount(n)} style={{flex: 1, padding: "12px", borderRadius: 10, border: questionCount === n ? "2px solid #0071E3" : "1px solid #D1D1D6", background: questionCount === n ? "rgba(0,113,227,0.08)" : "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer", color: questionCount === n ? "#0071E3" : "#1d1d1f"}}>{n}</button>
              ))}
            </div>
          </div>
          <div style={{marginBottom: 28}}>
            <button onClick={() => setOnlyStarred(!onlyStarred)} style={{display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "14px 16px", borderRadius: 12, border: onlyStarred ? "2px solid #FF9500" : "1px solid #D1D1D6", background: onlyStarred ? "rgba(255,149,0,0.06)" : "#fff", cursor: "pointer", textAlign: "left"}}>
              <Star size={18} color="#FF9500" fill={onlyStarred ? "#FF9500" : "none"} />
              <div>
                <div style={{fontSize: 15, fontWeight: 500, color: "#1d1d1f"}}>Solo preguntas 65/20</div>
                <div style={{fontSize: 13, color: "#6e6e73"}}>20 preguntas marcadas para mayores de 65 años con 20+ años de residencia</div>
              </div>
            </button>
          </div>
          <button onClick={startExam} style={{width: "100%", padding: "16px", borderRadius: 14, border: "none", background: "linear-gradient(135deg, #0071E3, #0077ED)", color: "#fff", fontSize: 17, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8}}>
            <Zap size={20} /> Comenzar Simulación
          </button>
        </div>

        <div style={{background: "#fff", borderRadius: 16, padding: 24, border: "1px solid rgba(0,0,0,0.06)", marginTop: 16}}>
          <div style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 12}}>
            <Lightbulb size={18} color="#FF9500" />
            <span style={{fontSize: 15, fontWeight: 600}}>Cómo funciona el examen real</span>
          </div>
          <div style={{fontSize: 14, color: "#424245", lineHeight: 1.6}}>
            <p style={{margin: "0 0 8px"}}>El oficial de USCIS le hará las preguntas en inglés de forma oral. Usted debe responder en inglés. En esta simulación:</p>
            <p style={{margin: "0 0 4px"}}>1. Verá la pregunta en inglés (como la escucharía en la entrevista)</p>
            <p style={{margin: "0 0 4px"}}>2. Verá la traducción al español para ayudarle a entender</p>
            <p style={{margin: "0 0 4px"}}>3. Intente responder mentalmente antes de ver la respuesta</p>
            <p style={{margin: "0"}}>4. Marque si acertó o falló para llevar su puntuación</p>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "result") {
    const correct = Object.values(userAnswers).filter(v => v === "correct").length;
    const incorrect = Object.values(userAnswers).filter(v => v === "incorrect").length;
    const unanswered = questions.length - correct - incorrect;
    const passed = questionCount <= 20 ? correct >= 12 : correct >= Math.ceil(questions.length * 0.6);
    const percentage = Math.round((correct / questions.length) * 100);
    const confettiColors = ["#FFD700","#0038a8","#BF0A30","#34C759","#FF9500","#fff","#AF52DE"];
    const confettiBits = passed ? Array.from({length: 30}, (_, i) => ({
      id: i,
      color: confettiColors[i % confettiColors.length],
      left: `${Math.random() * 100}%`,
      delay: `${Math.random() * 1.2}s`,
      duration: `${1.8 + Math.random() * 1.2}s`,
      size: Math.random() > 0.5 ? 10 : 7,
      rotate: Math.random() > 0.5 ? "3px" : "0",
    })) : [];

    return (
      <div style={{maxWidth: 560, margin: "48px auto 0"}}>
        <div style={{position: "relative", background: passed ? "linear-gradient(135deg, #E8F9ED, #D4F5DE)" : "linear-gradient(135deg, #FFF3E0, #FFE8CC)", borderRadius: 24, padding: 40, textAlign: "center", border: `1px solid ${passed ? "rgba(52,199,89,0.2)" : "rgba(255,149,0,0.2)"}`, overflow: "hidden"}}>
          {/* Confetti for pass */}
          {confettiBits.map(b => (
            <div key={b.id} className="confetti-bit" style={{
              left: b.left, top: 0, width: b.size, height: b.size,
              background: b.color, borderRadius: b.rotate,
              animationDuration: b.duration, animationDelay: b.delay,
            }} />
          ))}

          <div style={{position: "relative", zIndex: 1}}>
            <div style={{width: 88, height: 88, borderRadius: "50%", background: passed ? "linear-gradient(135deg, #34C759, #30D158)" : "linear-gradient(135deg, #FF9500, #FF8000)", display: "inline-flex", alignItems: "center", justifyContent: "center", marginBottom: 20, boxShadow: passed ? "0 8px 32px rgba(52,199,89,0.4)" : "0 8px 32px rgba(255,149,0,0.35)"}}>
              {passed ? <Award size={44} color="#fff" /> : <BookOpen size={44} color="#fff" />}
            </div>
            <h2 style={{fontSize: 28, fontWeight: 800, margin: "0 0 4px", letterSpacing: "-0.02em"}}>
              {passed ? "¡Felicidades! Aprobado 🎉" : "Sigue practicando"}
            </h2>
            <p style={{fontSize: 15, color: passed ? "#424245" : "#6e6e73", margin: "0 0 8px", lineHeight: 1.5}}>
              {passed
                ? "¡Excelente trabajo! Estás listo/a para el examen real."
                : "Cada intento te acerca más a tu ciudadanía. No te rindas."}
            </p>
            <p style={{fontSize: 52, fontWeight: 800, color: passed ? "#34C759" : "#FF9500", margin: "8px 0", letterSpacing: "-0.03em"}}>{percentage}%</p>
            <div style={{display: "flex", justifyContent: "center", gap: 20, margin: "16px 0 20px"}}>
              <div style={{background: "rgba(52,199,89,0.1)", borderRadius: 12, padding: "12px 20px"}}>
                <div style={{fontSize: 26, fontWeight: 700, color: "#34C759"}}>{correct}</div>
                <div style={{fontSize: 12, color: "#6e6e73", fontWeight: 500}}>Correctas</div>
              </div>
              <div style={{background: "rgba(255,59,48,0.08)", borderRadius: 12, padding: "12px 20px"}}>
                <div style={{fontSize: 26, fontWeight: 700, color: "#FF3B30"}}>{incorrect}</div>
                <div style={{fontSize: 12, color: "#6e6e73", fontWeight: 500}}>Incorrectas</div>
              </div>
              {unanswered > 0 && (
                <div style={{background: "rgba(134,134,139,0.08)", borderRadius: 12, padding: "12px 20px"}}>
                  <div style={{fontSize: 26, fontWeight: 700, color: "#86868b"}}>{unanswered}</div>
                  <div style={{fontSize: 12, color: "#6e6e73", fontWeight: 500}}>Sin resp.</div>
                </div>
              )}
            </div>
            <p style={{fontSize: 13, color: "#6e6e73", margin: "0 0 24px", lineHeight: 1.5}}>
              {questionCount <= 20 ? "Necesitas al menos 12 de 20 correctas (60%) para aprobar." : `Necesitabas ${Math.ceil(questions.length * 0.6)} correctas para aprobar.`}
            </p>
            {!passed && (
              <div style={{background: "rgba(0,56,168,0.06)", border: "1px solid rgba(0,56,168,0.12)", borderRadius: 14, padding: "14px 18px", marginBottom: 20, textAlign: "left"}}>
                <p style={{fontSize: 13, fontWeight: 600, color: "#0038a8", margin: "0 0 4px"}}>💡 Consejo para mejorar</p>
                <p style={{fontSize: 13, color: "#424245", margin: 0, lineHeight: 1.5}}>Usa el modo Flashcard para repasar las preguntas que fallaste. Enfócate en las marcadas con ⭐ (65/20) primero.</p>
              </div>
            )}
            <div style={{display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap"}}>
              <button onClick={() => setPhase("setup")} style={{padding: "14px 28px", borderRadius: 12, border: "none", background: passed ? "linear-gradient(135deg, #34C759, #30D158)" : "linear-gradient(135deg, #0038a8, #0050c8)", color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer", boxShadow: passed ? "0 4px 16px rgba(52,199,89,0.3)" : "0 4px 16px rgba(0,56,168,0.3)"}}>
                {passed ? "Intentar de nuevo" : "Volver a intentar"}
              </button>
              {!passed && (
                <button onClick={() => onNav("study")} style={{padding: "14px 24px", borderRadius: 12, border: "none", background: "#FF9500", color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer"}}>
                  <BookOpen size={16} style={{display: "inline", marginRight: 6}} />Estudiar más
                </button>
              )}
              <button onClick={() => onNav("home")} style={{padding: "14px 24px", borderRadius: 12, border: "1px solid #D1D1D6", background: "#fff", color: "#1d1d1f", fontSize: 15, fontWeight: 500, cursor: "pointer", display: "flex", alignItems: "center", gap: 6}}>
                <Home size={16} /> Inicio
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Exam phase
  const q = questions[current];
  const answered = userAnswers[q.id];
  const correct = Object.values(userAnswers).filter(v => v === "correct").length;
  const incorrect = Object.values(userAnswers).filter(v => v === "incorrect").length;

  return (
    <div style={{maxWidth: 640, margin: "48px auto 0"}}>
      {/* Header */}
      <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20}}>
        <button onClick={() => setPhase("setup")} style={{display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", cursor: "pointer", fontSize: 14, color: "#0071E3", fontWeight: 500}}>
          <X size={16} /> Salir
        </button>
        <div style={{display: "flex", gap: 16, fontSize: 14, fontWeight: 600}}>
          <span style={{color: "#34C759"}}>{correct} correctas</span>
          <span style={{color: "#FF3B30"}}>{incorrect} incorrectas</span>
        </div>
      </div>

      {/* Progress */}
      <div style={{marginBottom: 24}}>
        <div style={{display: "flex", justifyContent: "space-between", fontSize: 13, color: "#86868b", marginBottom: 6}}>
          <span>Pregunta {current + 1} de {questions.length}</span>
          <span>{Math.round(((current + 1) / questions.length) * 100)}%</span>
        </div>
        <div style={{height: 4, background: "#E5E5EA", borderRadius: 2}}>
          <div style={{height: 4, background: "#0071E3", borderRadius: 2, width: `${((current + 1) / questions.length) * 100}%`, transition: "width 0.3s"}} />
        </div>
      </div>

      {/* Question card */}
      <div style={{background: "#fff", borderRadius: 20, padding: 32, border: "1px solid rgba(0,0,0,0.06)", marginBottom: 16}}>
        <div style={{display: "flex", alignItems: "center", gap: 8, marginBottom: 16}}>
          <span style={{fontSize: 12, fontWeight: 700, color: "#86868b"}}>PREGUNTA {q.id}</span>
          {q.starred && <Star size={14} color="#FF9500" fill="#FF9500" />}
        </div>
        
        {/* English - what you'd hear */}
        <div style={{background: "rgba(0,113,227,0.04)", borderRadius: 12, padding: 16, marginBottom: 12}}>
          <div style={{fontSize: 11, fontWeight: 700, color: "#0071E3", marginBottom: 6, textTransform: "uppercase"}}>English (como lo escucharía)</div>
          <p style={{fontSize: 18, fontWeight: 600, margin: 0, color: "#1d1d1f", lineHeight: 1.4}}>{q.q_en}</p>
        </div>

        {/* Spanish */}
        <div style={{background: "rgba(255,149,0,0.04)", borderRadius: 12, padding: 16, marginBottom: 20}}>
          <div style={{fontSize: 11, fontWeight: 700, color: "#FF9500", marginBottom: 6, textTransform: "uppercase"}}>Español (traducción)</div>
          <p style={{fontSize: 16, margin: 0, color: "#424245", lineHeight: 1.4}}>{q.q_es}</p>
        </div>

        {/* Show answer */}
        {!showResult ? (
          <button onClick={() => setShowResult(true)} style={{width: "100%", padding: "14px", borderRadius: 12, border: "2px dashed #D1D1D6", background: "transparent", cursor: "pointer", fontSize: 15, color: "#6e6e73", display: "flex", alignItems: "center", justifyContent: "center", gap: 8}}>
            <Eye size={18} /> Ver respuesta correcta
          </button>
        ) : (
          <div>
            <div style={{background: "rgba(52,199,89,0.06)", borderRadius: 12, padding: 16, marginBottom: 16}}>
              <div style={{fontSize: 11, fontWeight: 700, color: "#34C759", marginBottom: 8, textTransform: "uppercase"}}>Respuestas aceptadas</div>
              {q.answers_en.map((a, i) => (
                <div key={i} style={{marginBottom: i < q.answers_en.length - 1 ? 10 : 0, padding: "6px 0"}}>
                  <div style={{fontSize: 15, fontWeight: 500, color: "#1d1d1f"}}>{a}</div>
                  <div style={{fontSize: 14, color: "#6e6e73"}}>{q.answers_es[i]}</div>
                </div>
              ))}
            </div>
            {!answered && (
              <div style={{display: "flex", gap: 10}}>
                <button onClick={() => markAnswer(q.id, "correct")} style={{flex: 1, padding: "14px", borderRadius: 12, border: "none", background: "#34C759", color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6}}>
                  <Check size={18} /> Acerté
                </button>
                <button onClick={() => markAnswer(q.id, "incorrect")} style={{flex: 1, padding: "14px", borderRadius: 12, border: "none", background: "#FF3B30", color: "#fff", fontSize: 15, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6}}>
                  <X size={18} /> Fallé
                </button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Navigation */}
      <div style={{display: "flex", gap: 10}}>
        <button disabled={current === 0} onClick={() => { setCurrent(current - 1); setShowResult(false); }} style={{flex: 1, padding: "14px", borderRadius: 12, border: "1px solid #D1D1D6", background: "#fff", cursor: current === 0 ? "not-allowed" : "pointer", fontSize: 15, fontWeight: 500, opacity: current === 0 ? 0.4 : 1}}>
          Anterior
        </button>
        {current < questions.length - 1 ? (
          <button onClick={nextQ} style={{flex: 1, padding: "14px", borderRadius: 12, border: "none", background: "#0071E3", color: "#fff", cursor: "pointer", fontSize: 15, fontWeight: 600}}>
            Siguiente
          </button>
        ) : (
          <button onClick={finish} style={{flex: 1, padding: "14px", borderRadius: 12, border: "none", background: "linear-gradient(135deg, #34C759, #30D158)", color: "#fff", cursor: "pointer", fontSize: 15, fontWeight: 600}}>
            Ver resultados
          </button>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
